name = "athena"
compatibility_date = "2024-01-01"

[site]
bucket = ".svelte-kit/cloudflare"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "athena-db"
database_id = "c25a363d-5b0d-4a75-bc73-d6021589c228"

# Environment variables
# In production, set these in Cloudflare dashboard
# [env.production.vars]
# DISCORD_CLIENT_ID = "your-discord-client-id"
# DISCORD_CLIENT_SECRET = "your-discord-client-secret"
# DISCORD_REDIRECT_URI = "https://your-domain.pages.dev/api/auth/callback"
